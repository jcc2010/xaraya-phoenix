<VirtualHost *:80>
    DocumentRoot /app/public
    <Directory /app/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        # Files that exist (published assets) are served as they are; everything else goes to the front controller.
        FallbackResource /index.php
    </Directory>
    # Published assets are symlinks into modules/*/assets and themes/*/assets: never run PHP from them.
    <Directory /app/public/assets>
        <FilesMatch "\.(php|phar|phtml)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
