expose_php = Off
display_errors = Off
log_errors = On
; Media uploads are capped at 10 MB by the app; leave room for the multipart overhead.
upload_max_filesize = 12M
post_max_size = 13M
memory_limit = 256M
opcache.enable = 1
; var/cache (routes, config) is rewritten by `bin/xar module:enable` and friends while Apache runs: keep checking.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
